<script type="text/babel">
/*src/screen-calendar-sync.jsx*/
// src/screen-calendar-sync.jsx — Account → Calendar Sync
//
// Lets a logged-in customer overlay their Momentum schedule onto the
// calendar app they already use. Google + Outlook are true two-way OAuth
// connections (once connected, every visit stays in sync automatically —
// no manual export). Apple has no consumer OAuth calendar API, so it gets
// a subscribed live-feed link instead: subscribe once, it refreshes itself
// forever.
function ProviderMark({ tone, letter }) {
  return (
    <span className={`cal-mark cal-mark-${tone}`} aria-hidden="true">{letter}</span>
  );
}

function CalendarSyncGroup({ customerEmail }) {
  const [status, setStatus] = React.useState(null);
  const [busy, setBusy] = React.useState(null); // provider currently mid-action
  const [consent, setConsent] = React.useState(null); // { provider, name, email }
  const [copiedApple, setCopiedApple] = React.useState(false);
  const [appleOpen, setAppleOpen] = React.useState(false);

  const refresh = React.useCallback(() => {
    window.MLApi.calendarStatus().then(setStatus).catch(() => {});
  }, []);

  React.useEffect(() => { refresh(); }, [refresh]);

  // Live-OAuth popup flow: listen for the callback page's postMessage.
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data && e.data.momentumCalendar) {
        setBusy(null);
        refresh();
      }
    };
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, [refresh]);

  const startConnect = async (provider, name) => {
    setBusy(provider);
    try {
      const r = await window.MLApi.calendarConnectUrl(provider);
      if (r?.mock) {
        setBusy(null);
        setConsent({ provider, name, email: customerEmail || "you@gmail.com" });
      } else if (r?.url) {
        window.open(r.url, "momentum-cal-connect", "width=480,height=640");
      } else {
        setBusy(null);
      }
    } catch {
      setBusy(null);
    }
  };

  const confirmConsent = async () => {
    const { provider, email } = consent;
    setConsent(null);
    setBusy(provider);
    try { await window.MLApi.calendarMockConnect(provider, email); }
    finally { setBusy(null); refresh(); }
  };

  const disconnect = async (provider) => {
    setBusy(provider);
    try { await window.MLApi.calendarDisconnect(provider); }
    finally { setBusy(null); refresh(); }
  };

  const copyAppleLink = async () => {
    const link = status?.apple?.feed_url || "";
    try { await navigator.clipboard.writeText(link.replace(/^webcal:/, "https:")); } catch {}
    setCopiedApple(true);
    setTimeout(() => setCopiedApple(false), 1600);
  };

  if (!status) return null;

  // Google and Apple only. Outlook was listed but is not something we offer,
  // so it promised a connection that goes nowhere.
  // Apple needs no sign-in — it is a subscription link — so it belongs here
  // whenever the backend offers it. Outlook is not built.
  const providers = [
    { key: "google", name: "Google Calendar", tone: "google", letter: "G" },
    { key: "apple", name: "Apple Calendar", tone: "apple", letter: "A" },
  ].filter((p) => status[p.key]);

  return (
    <React.Fragment>
      <section className="settings-group">
        <div className="sg-title">Calendar Sync</div>
        <div className="card sg-card">
          {providers.map((p) => {
            const conn = status[p.key];
            return (
              <div key={p.key} className="cal-row">
                <ProviderMark tone={p.tone} letter={p.letter} />
                <div className="cal-row-text">
                  <div className="cal-row-name">{p.name}</div>
                  <div className="cal-row-sub">
                    {conn.connected ? `Connected · ${conn.email}` : "Two-way sync · not connected"}
                  </div>
                </div>
                {conn.connected ? (
                  <button className="cal-btn cal-btn-ghost" disabled={busy === p.key} onClick={() => disconnect(p.key)}>
                    {busy === p.key ? "…" : "Disconnect"}
                  </button>
                ) : (
                  <button className="cal-btn" disabled={busy === p.key} onClick={() => startConnect(p.key, p.name)}>
                    {busy === p.key ? "…" : "Connect"}
                  </button>
                )}
              </div>
            );
          })}

          <div className="cal-row">
            <ProviderMark tone="apple" letter="" />
            <div className="cal-row-text">
              <div className="cal-row-name">Apple Calendar</div>
              <div className="cal-row-sub">Subscribed feed · stays current automatically</div>
            </div>
            <button className="cal-btn" onClick={() => setAppleOpen((v) => !v)}>
              {appleOpen ? "Hide" : "Subscribe"}
            </button>
          </div>
          {appleOpen && (
            <div className="cal-apple-panel">
              <p>
                Tap the link on your iPhone or Mac to subscribe — Apple Calendar will check for
                updates on its own from then on, so reschedules show up automatically.
              </p>
              <div className="cal-apple-linkrow">
                <code className="cal-apple-link">{status.apple.feed_url}</code>
                <button className="cal-btn cal-btn-ghost" onClick={copyAppleLink}>
                  {copiedApple ? "Copied" : "Copy"}
                </button>
              </div>
              <a className="cal-apple-open" href={status.apple.feed_url}>Open in Calendar app →</a>
            </div>
          )}
        </div>
      </section>

      {consent && (
        <div className="acc-sheet-backdrop" onClick={() => setConsent(null)}>
          <div className="acc-sheet cal-consent" onClick={(e) => e.stopPropagation()}>
            <div className="cal-consent-mark">
              <ProviderMark tone={consent.provider} letter={consent.provider === "google" ? "G" : "O"} />
            </div>
            <div className="acc-sheet-title">Connect {consent.name}</div>
            <div className="acc-sheet-body">
              Momentum Landscaping wants to view and edit events on your calendar, so your
              service visits stay overlaid automatically — no exporting, no manual updates.
            </div>
            <div className="cal-consent-account">Signed in as {consent.email}</div>
            <div className="cal-consent-actions">
              <button className="cal-btn cal-btn-ghost" onClick={() => setConsent(null)}>Cancel</button>
              <button className="cal-btn cal-btn-primary" onClick={confirmConsent}>Allow</button>
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

window.CalendarSyncGroup = CalendarSyncGroup;

</script>

// Schedule a Quote — no-login ad landing screen
const SERVICE_OPTIONS = [
  { value: "weekly", label: "Weekly Lawn Maintenance" },

];

function formatPhone(raw) {
  const d = raw.replace(/\D/g, "").slice(0, 10);
  if (d.length < 4) return d;
  if (d.length < 7) return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}

function QuoteScreen({ onBack }) {
  // Same form as the website's quote panel — same fields, same time slots, same
  // wording, and the same POST to /api/leads. It was collecting a service
  // dropdown the site never asks for and then submitting nowhere at all, so a
  // request made in the app reached no one.
  const SLOTS = ["12 PM – 2 PM", "2 PM – 4 PM", "4 PM – 6 PM", "6 PM – 8 PM"];

  const [name, setName] = React.useState("");
  const [phone, setPhone] = React.useState("");

  const submit = async (e) => {
    e.preventDefault();
    if (!slot) { setErr("Pick a time that works for you."); return; }
    setErr(""); setBusy(true);
    try {
      const res = await fetch("https://crm.momentumlandscapingut.com/api/leads", {

        body: JSON.stringify({
          full_name: name,
          phone,
          address,
          requested_window: slot,
          company: "",
        }),
      });
      let data = {};
      try { data = await res.json(); } catch (_) {}
      if (!res.ok || data.error) throw new Error(data.error || "fail");
      setSubmitted(true);
    } catch (_) {
      setErr("Something hiccuped — tap Request My Personal Quote again.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="screen screen-quote">

              value={name} onChange={(e) => setName(e.target.value)}

            <label className="qf-label" htmlFor="qf-phone">Phone Number</label>
            <input
              id="qf-phone" className="qf-input" type="tel" required inputMode="tel"
              placeholder="(555) 123-4567"
              value={phone} onChange={(e) => setPhone(formatPhone(e.target.value))}
            />

            <label className="qf-label" htmlFor="qf-address">Property Address</label>

              id="qf-address" className="qf-input" type="text" required
              placeholder="1428 Cedar Lane, South Jordan UT"
              value={address} onChange={(e) => setAddress(e.target.value)}

            <label className="qf-label">Preferred Visit Time</label>

        </div>

  );
}

<script type="text/babel">
/*src/app-prod.jsx*/
// Main app — one adaptive layout: routing, login state, tweaks panel.
// No breakpoint fork into separate mobile/desktop component trees — a single
// AppNav + single set of screens reflow via CSS from phone width up to desktop.
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primaryTeal": "#4a8fb5",
  "navy": "#1c2e44",
  "cardStyle": "frost",
  "bgIntensity": 1,
  "clientStatus": "active",
  "customerName": "Jane Anderson",
  "customerEmail": "demo@momentumlandscapingut.com",
  "customerAddress": "South Jordan, UT",
  "plan": "Weekly Lawn Care",
  "apiMode": "live",
  "apiBase": "/api/portal"
}/*EDITMODE-END*/;

class AppErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { failed: false }; }
  static getDerivedStateFromError() { return { failed: true }; }
  componentDidCatch(err) { try { console.error("Momentum app error:", err); } catch (e) {} }
  render() {
    if (!this.state.failed) return this.props.children;
    return (
      <div style={{
        minHeight: "100dvh", display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", gap: 14, padding: 32,
        background: "#0F1720", color: "#fff", textAlign: "center", fontFamily: "inherit",
      }}>
        <div style={{ fontSize: 20, fontWeight: 700 }}>That screen hit a snag</div>
        <div style={{ fontSize: 15, opacity: 0.7, maxWidth: 320, lineHeight: 1.5 }}>
          Nothing was lost. Reload and you'll be right back where you were.
        </div>
        <button
          onClick={() => window.location.reload()}
          aria-label="Reload the app"
          style={{
            marginTop: 8, background: "#7FB8BE", color: "#0F1720", border: 0,
            borderRadius: 14, padding: "13px 28px", fontSize: 16, fontWeight: 700,
            fontFamily: "inherit", minHeight: 44, cursor: "pointer",
          }}
        >
          Reload
        </button>
      </div>
    );
  }
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState("home");
  const [user, setUser] = React.useState(() => {
    // No auto-login: every session must sign in through the login screen.
    try {
      const stored = JSON.parse(sessionStorage.getItem("ml_user") || "null");
      if (stored) return stored;
    } catch {}
    return null;
  });

  // apply CSS variables from tweaks
  React.useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--teal", tweaks.primaryTeal);
    r.style.setProperty("--navy", tweaks.navy);
  }, [tweaks.primaryTeal, tweaks.navy]);

  // Sync API config to MLApi dispatcher
  React.useEffect(() => {
    window.MLConfig = Object.assign(window.MLConfig || {}, {
      mode: tweaks.apiMode,
      apiBase: tweaks.apiBase,
    });
  }, [tweaks.apiMode, tweaks.apiBase]);

  // Health-check the backend when live mode is on
  const [backendStatus, setBackendStatus] = React.useState(null); // null | 'checking' | 'up' | 'down'
  React.useEffect(() => {
    if (tweaks.apiMode !== "live") { setBackendStatus(null); return; }
    setBackendStatus("checking");
    let cancelled = false;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 3500);
    fetch(`${tweaks.apiBase}/status`, { signal: ctrl.signal })
      .then(r => r.json())
      .then(j => { if (!cancelled) setBackendStatus(j?.ok ? "up" : "down"); })
      .catch(() => { if (!cancelled) setBackendStatus("down"); })
      .finally(() => clearTimeout(t));
    return () => { cancelled = true; ctrl.abort(); };
  }, [tweaks.apiMode, tweaks.apiBase]);

  React.useEffect(() => {
    if (user) sessionStorage.setItem("ml_user", JSON.stringify(user));
    else sessionStorage.removeItem("ml_user");
  }, [user]);

  const customerName = user?.name || tweaks.customerName;
  const customerEmail = user?.email || tweaks.customerEmail;

  /**
   * Notification taps from the iOS shell.
   *
   * The shell was setting window.location.hash, but this page keeps its screen
   * in React state and never reads location.hash — grep returns zero. So every
   * notification tap landed on whatever screen was already showing. The shell
   * calls this instead.
   *
   * A tap can also arrive before the page has mounted, so anything the shell
   * parked on __momentumPendingRoute gets drained here.
   */
  React.useEffect(() => {
    const ROUTES = ["home", "schedule", "messages", "services", "account", "quote"];
    const open = (r) => {
      const target = String(r || "").replace(/^#/, "").trim().toLowerCase();
      if (ROUTES.includes(target)) setRoute(target);
    };
    window.momentumOpen = open;
    const pending = window.__momentumPendingRoute;
    if (pending) { window.__momentumPendingRoute = null; open(pending); }
    return () => { delete window.momentumOpen; };
  }, []);

  // Every portal request reads the id from the session, so it is written the
  // moment anyone signs in — real account or walkthrough.
  React.useEffect(() => {
    try {
      if (user && user.id) sessionStorage.setItem("ml_customer_id", user.id);
      else sessionStorage.removeItem("ml_customer_id");
    } catch (e) {}
  }, [user && user.id]);

  const handleLogin = (u) => {
    // id is what every /api/portal route is keyed on; dropping it here is
    // what left the app talking to its own mock data.
    setUser({ id: u.id || null, name: u.name || u.email || "there", email: u.email || null, needs: u.needs || [] });
    setRoute("home");
  };

  // Signing in blank opens the real app on a real account.
  //
  // A walkthrough with no customer id could only ever show samples, because
  // every portal route is keyed on that id. So this signs in as a standing
  // account that genuinely exists in the database with its own weekly history
  // and upcoming visits — live schedule, live billing, live everything. It is a
  // stand-in identity rather than a real customer, because this page is public
  // and nobody's actual address or billing should be one tap from the internet.
  const DEMO_CUSTOMER_ID = "e0fc3832-0294-4ca7-be65-078cb2b18ed0";

  const handleSneakPeek = async () => {
    setUser({ id: DEMO_CUSTOMER_ID, name: tweaks.customerName, email: tweaks.customerEmail });
    setRoute("home");
    try {
      const me = await window.MLApi.me();
      const c = (me && me.customer) || null;
      if (c) setUser({ id: c.id, name: c.name || tweaks.customerName, email: c.email || tweaks.customerEmail });
    } catch (e) {
      // The id is already set, so every screen is live regardless — this call
      // only sharpens the name on the account header.
    }
  };

  const handleLogout = () => {
    setUser(null);
    sessionStorage.removeItem("ml_msgs");
    // A peek switched the app to sample data; put the real backend back.
    window.MLConfig = Object.assign(window.MLConfig || {}, {
      mode: tweaks.apiMode, apiBase: tweaks.apiBase,
    });
    setRoute("home");
  };

  // Quote screen is reachable WITHOUT login — ad-traffic landing page
  let screen;
  let screenLabel;
  let showNav = !!user;
  if (route === "quote") {
    screen = <QuoteScreen tweaks={tweaks} onBack={() => setRoute(user ? "home" : "login")} />;
    screenLabel = user ? "06 quote" : "00 quote";
    showNav = false;
  } else if (!user) {
    screen = <LoginScreen mode={tweaks.apiMode} onLogin={handleLogin} onGetQuote={() => setRoute("quote")} onSneakPeek={handleSneakPeek} />;
    screenLabel = "00 login";
  } else if (route === "home") {
    screen = <HomeScreen tweaks={tweaks} customerName={customerName} customerId={user && user.id} onGetQuote={() => setRoute("quote")} onNavigate={setRoute} clientStatus={tweaks.clientStatus} />;
    screenLabel = "01 home";
  } else if (route === "schedule") {
    screen = <ScheduleScreen tweaks={tweaks} />;
    screenLabel = "02 schedule";
  } else if (route === "messages") {
    screen = <MessagesScreen tweaks={tweaks} customerName={customerName} />;
    screenLabel = "04 messages";
  } else if (route === "services") {
    screen = <ServicesScreen tweaks={tweaks} />;
    screenLabel = "03 services";
  } else if (route === "account") {
    screen = <AccountScreen tweaks={tweaks} customerName={customerName} customerEmail={customerEmail} customerAddress={tweaks.customerAddress} plan={tweaks.plan} onLogout={handleLogout} />;
    screenLabel = "05 account";
  }

  // Every tab is open. A walkthrough session used to get Home only, with the
  // rest frosted over behind a "Members only" card — that is what made the app
  // feel locked when signing in blank.
  const peekVeiled = false;

  return (
    <React.Fragment>
      <div className="app-frame">
        {showNav && (
          <AppNav
            active={route}
            onChange={setRoute}
            onGetQuote={() => setRoute("quote")}
            onLogout={handleLogout}
            customerName={customerName}
            customerEmail={customerEmail}
          />
        )}
        <main
          key={user ? route : `guest-${route}`}
          className={`app-main screen-fade-enter screen-fade-enter-active ${showNav ? "" : "app-main-bare"}`}
          data-screen-label={screenLabel}
        >
          {screen}
          {peekVeiled && (
            <div className="peek-veil">
              <div className="peek-veil-card">
                <div className="pv-title">Members only</div>
                <div className="pv-sub">This part of the app unlocks when you become a customer.</div>
                <button type="button" className="pv-cta" onClick={() => setRoute("quote")}>Get a personal quote →</button>
                <button type="button" className="pv-back" onClick={() => setRoute("home")}>Back to home</button>
              </div>
            </div>
          )}
        </main>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <AppErrorBoundary><App /></AppErrorBoundary>
);

</script>

<style>
/* ── Day chips are selectable ────────────────────────────────────
   Tapping the tile used to jump to Schedule, so there was no way to look at
   another day without leaving home. The card no longer navigates; a day chip
   selects instead. */
.calstrip .cs-day{cursor:pointer;border-radius:14px;padding:4px 2px;transition:background .16s,transform .12s}
.calstrip .cs-day:active{transform:scale(.96)}
.calstrip .cs-day[data-selected="true"]{background:rgba(58,110,165,.14);
  box-shadow:inset 0 0 0 1.5px rgba(58,110,165,.55)}
.calstrip .cs-day:focus-visible{outline:2px solid #3A6EA5;outline-offset:2px}

/* ── Living background ───────────────────────────────────────────
   The photo drifts slowly and parallaxes against scroll. Slow enough to read
   as depth rather than motion, and disabled outright for anyone who has asked
   the system for reduced motion. */
.app-bg{will-change:transform}
@keyframes mlDrift{
  0%{transform:scale(1.10) translate3d(0,0,0)}
  50%{transform:scale(1.14) translate3d(-1.2%,-1.4%,0)}
  100%{transform:scale(1.10) translate3d(0,0,0)}
}
.ml-parallax{animation:mlDrift 38s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ml-parallax{animation:none!important}}
</style>
<script>
(function(){
  /* The background parallax belongs to the React LandscapeBG component, which
     drives .bg-photo directly. What used to sit here was a second, older copy
     of that idea, and it was the home logo bug:

       - it selected '.home-hero' — the logo's own layout box, not a background
         (its intended target, '.app-bg', does not exist in the DOM at all), and
       - added .ml-parallax to it, whose mlDrift keyframes animate
         transform: scale(1.10 -> 1.14). Layout width was never wrong: the hero
         measured exactly the cards' width, then rendered 10-14% wider, and
         drifting, because an ancestor was scaled.
       - it ran once and then cleared its interval, so only the first .home-hero
         ever got the class. Navigating to a tab and back remounted the hero
         without it. That is the second size, and why the logo was wrong in two
         different directions.
       - its scroll work was inert regardless: backgroundPositionY on an element
         with no background image, on a '.home-grid' that is overflow:hidden and
         never scrolls.

     transform:none !important on .ml-logo could never have caught this, because
     the transform was on the parent. Only the day chips below were ever real. */
  /* Day chips select rather than navigate. */
  function chips(){
    var strip = document.querySelector('.calstrip');
    if(!strip) return false;
    var days = strip.querySelectorAll('.cs-day, [class*="cs-day"]');
    if(!days.length) return false;
    days.forEach(function(d,i){
      d.setAttribute('role','button');
      d.setAttribute('tabindex','0');
      function pick(e){
        e.preventDefault(); e.stopPropagation();
        days.forEach(function(x){ x.removeAttribute('data-selected'); });
        d.setAttribute('data-selected','true');
        document.dispatchEvent(new CustomEvent('ml:daypick',{detail:{index:i}}));
      }
      d.addEventListener('click',pick);
      d.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' ') pick(e); });
    });
    return true;
  }
  var tries=0;
  var t=setInterval(function(){
    var ok = chips();
    if(ok || ++tries>40) clearInterval(t);
  },250);
})();
</script>

<style>
/* ── Pass: the small things ──────────────────────────────────────

   Tap targets. Thirty-one of thirty-five controls declared a height under
   Apple's 44pt minimum. A customer using this stands in a doorway one-handed,
   so anything tappable gets a real target without changing how it looks. */
button, [role="button"], a.btn, .tab, .tabbar > *, .st-toggle, .cs-day {
  min-height: 44px;
  touch-action: manipulation;          /* kills the 300ms double-tap delay */
}
.cs-day { min-height: 44px; display: flex; flex-direction: column;
          align-items: center; justify-content: center }

/* Text selection and callouts. Long-pressing a label in an app should not
   offer to look it up or copy it — that reads as a web page, not an app. */
body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text }

/* iOS zooms the whole page when a field under 16px takes focus, which then
   leaves the layout shifted. */
input, select, textarea { font-size: 16px }

/* Momentary grey flash on every tap. */
* { -webkit-tap-highlight-color: transparent }

/* Focus has to stay visible for anyone navigating by keyboard or switch. */
:focus-visible { outline: 2px solid #3A6EA5; outline-offset: 2px; border-radius: 10px }

/* Respect the system setting rather than animating regardless. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important;
    animation-iteration-count: 1 !important; transition-duration: .01ms !important }
}
</style>
</body>
</html>
