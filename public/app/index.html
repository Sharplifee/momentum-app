<script>
/* Point the app at the live backend before it boots.
   The app ships defaulting to mock mode against /api/portal — the
   developer's own machine — which is why sign-in reported "Authentication
   service was unavailable". It reads window.MLConfig if that exists first, so
   this sets it rather than editing the app.
   Its own call() falls back to mock on a failed request, so a backend outage
   degrades to preview data instead of a dead screen. */
window.MLConfig = {
  mode: "live",
  apiBase: "/api/portal"
};
</script>

<style>
/* Momentum Landscaping — one adaptive portal: phone width up through desktop.
   No breakpoint fork into separate component trees; the same screens reflow
   via the rules below. Breakpoint: 880px. */
:root {
  --teal: #4a8fb5;
  --teal-deep: #2f6c8e;
  --navy: #1c2e44;
  --ice: #96b2be;
  --ice-tint: rgba(228,244,252,0.72);
  --frost: rgba(255,255,255,0.91);
  --frost-soft: rgba(255,255,255,0.70);
  --glass: rgba(255,255,255,0.46);
  --glass-edge: rgba(255,255,255,0.85);
  --gold: oklch(0.78 0.10 70);
  --font: 'DM Sans', system-ui, -apple-system, sans-serif;
  --green-ok: #6ba3c7;
  --sky: #6ba3c7;
  --sky-soft: rgba(107,163,199,0.18);
  --card-radius: 20px;
  --content-max: 1040px;
  --nav-w: 240px;
  --tabbar-h: 84px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  color: var(--navy);
  background: #fbfcfd;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--teal-deep); }
a:hover { color: var(--teal); }

.serif { font-family: var(--font); }

/* ═══════════════ Adaptive app frame — nav + main reflow via CSS ═══════════════ */
.app-frame {
  min-height: 100vh;
  min-height: 100dvh;
}
.app-main {
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: var(--tabbar-h);
  position: relative;
}
.app-main-bare { padding-bottom: 0; }

/* Unified nav: bottom tab bar under the breakpoint, left sidebar above it */
.app-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: var(--tabbar-h);
  z-index: 40;
  display: flex;
  align-items: stretch;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid rgba(28,46,68,0.10);
  padding: 6px 4px 24px;
}
.app-nav-brand, .app-nav-foot { display: none; }
.app-nav-items { display: flex; flex: 1; }
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: transparent;
  border: 0;
  color: #aabece;
  cursor: pointer;
  padding: 4px 2px;
  font-family: inherit;
}
.nav-tab.is-active { color: var(--navy); }
.nav-icon svg { width: 22px; height: 22px; display: block; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; }

/* Nav stays a bottom bar at every width — brand/CTA/user block are sidebar-only
   extras and remain hidden regardless of viewport size. */

/* Screens sit inside app-main; padding-top gives breathing room since there's
   no device status bar to clear. */
.screen { position: relative; }
.screen-home { padding-top: 0; }
.screen-schedule, .screen-messages, .screen-services, .screen-account { padding-top: 0; }
.screen-messages { display: flex; flex-direction: column; height: calc(100dvh - var(--tabbar-h)); }

/* ───────────── Photographic landscape ───────────── */
.landscape-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-photo {
  position: absolute; left: 50%; top: 50%; width: 110%; height: 110%;
  object-fit: cover; object-position: 50% 78%;
  transform: translate(-50%, -50%); display: block; will-change: transform;
  max-width: none; filter: blur(6px) saturate(1.02);
}
.bg-photo-vignette {
  position: absolute; inset: 0;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.10) 18%, rgba(255,255,255,0.04) 36%, transparent 55%),
    linear-gradient(180deg, transparent 58%, rgba(28,46,30,0.06) 75%, rgba(28,46,30,0.14) 92%, rgba(28,46,30,0.22) 100%);
  backdrop-filter: blur(3px) saturate(0.96);
  -webkit-backdrop-filter: blur(3px) saturate(0.96);
  pointer-events: none;
}

/* ───────────── Logo ───────────── */
.ml-logo { display: flex; align-items: center; justify-content: center; user-select: none; }
.ml-logo-img { width: 100%; height: auto; display: block; max-width: 240px; }
.ml-logo-sm img { width: 32px; height: auto; display: block; }
.ml-logo-sm { display: inline-flex; align-items: center; gap: 8px; }
.ml-logo-sm span { font-family: var(--font); font-weight: 800; font-size: 16px; letter-spacing: 0.04em; }
.app-nav-brand .ml-logo-sm span { color: #fff; }

/* ───────────── Avatar / pill ───────────── */
.avatar {
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; color: #ffffff;
  font-family: var(--font);
  box-shadow: 0 2px 10px rgba(28,46,68,0.20), 0 0 0 2px rgba(255,255,255,0.7);
  flex-shrink: 0;
}
.pill { display: inline-flex; align-items: center; padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.pill-teal { background: var(--teal); color: #ffffff; }
.pill-green { background: rgba(107,163,199,0.18); color: var(--teal-deep); }
.pill-muted { background: rgba(28,46,68,0.08); color: var(--navy); }
.pill-muted-light { background: rgba(255,255,255,0.18); color: #ffffff; border: 1px solid rgba(255,255,255,0.30); }

/* ───────────── Cards / generic ───────────── */
.card {
  background: var(--frost);
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  border-radius: var(--card-radius);
  border: 0.5px solid rgba(255,255,255,0.7);
  box-shadow: 0 8px 30px -10px rgba(28,46,68,0.18);
}

/* ───────────── HOME ───────────── */
.screen-home {
  background: transparent;
  display: flex;
  flex-direction: column;
  padding-top: 28px;
  min-height: calc(100dvh - var(--tabbar-h));
}
.home-grid {
  position: relative; z-index: 2;
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 16px 24px;
}
.home-hero {
  position: relative; z-index: 1;
  width: 100%;
  flex: 1 0 auto;
  min-height: 150px;
  display: flex; justify-content: center; align-items: center;
}
.home-hero .ml-logo { display: flex; justify-content: center; align-items: center; width: 100%; }
.home-hero .ml-logo img, .home-hero .ml-logo-img {
  width: 100%; max-width: 100%; height: auto !important; object-fit: contain !important;
  display: block; margin: 0 auto;
  filter: drop-shadow(0 4px 18px rgba(28,46,68,0.18));
}

.home-content-grid { display: flex; flex-direction: column; gap: 14px; }
.home-col-main, .home-col-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* Quick actions — glass buttons under the cards */
.qa-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qa-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  padding: 15px 12px; min-height: 52px;
  background: var(--glass);
  backdrop-filter: blur(34px) saturate(1.4);
  -webkit-backdrop-filter: blur(34px) saturate(1.4);
  border: 0.5px solid var(--glass-edge);
  border-radius: 18px;
  box-shadow: 0 12px 28px -12px rgba(28,46,68,0.26), 0 1px 0 rgba(255,255,255,0.5) inset;
  color: var(--navy); font-family: inherit; font-weight: 700; font-size: 14px;
  cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.qa-btn:hover { transform: translateY(-1px); }
.qa-btn:active { transform: translateY(0); }
.qa-btn svg { width: 18px; height: 18px; color: var(--teal-deep); }

.crew-card { padding: 17px 20px; }
.crew-card-title { font-weight: 700; font-size: 14.5px; margin-bottom: 12px; color: var(--navy); }
.crew-avatars-row { display: flex; gap: 10px; margin-bottom: 12px; }
.account-mini { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
.account-mini-name { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; color: var(--navy); }

@media (min-width: 880px) {
  .home-grid { max-width: 560px; margin: 0 auto; padding: 0 40px 56px; }
  .home-hero { min-height: 210px; }
  .home-content-grid-solo { gap: 20px; }
  .home-content-grid-solo .home-col-main { gap: 20px; }
  .ns-card { padding: 26px 28px 22px; }
  .combo-card { padding: 24px 28px; }
  .ns-headline { font-size: 31px; }
}

/* ───────── Premium glass tile (home) ───────── */
.ns-card, .combo-card {
  position: relative;
  background: var(--glass);
  backdrop-filter: blur(34px) saturate(1.4);
  -webkit-backdrop-filter: blur(34px) saturate(1.4);
  border-radius: 26px;
  border: 0.5px solid var(--glass-edge);
  box-shadow: 0 18px 38px -14px rgba(28,46,68,0.28), 0 1px 0 rgba(255,255,255,0.55) inset, 0 -1px 0 rgba(255,255,255,0.12) inset;
  overflow: hidden;
}
.ns-card::before, .combo-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 38%);
  pointer-events: none;
}
.ns-card {
  padding: 18px 20px 16px; cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  flex: 0 0 auto; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
}
.ns-card:hover { transform: translateY(-1px); box-shadow: 0 22px 42px -14px rgba(28,46,68,0.32), 0 1px 0 rgba(255,255,255,0.55) inset; }
.ns-card:active { transform: translateY(0); }

.ns-eyebrow { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(28,46,68,0.7); }
.ns-eyebrow-l { display: inline-flex; align-items: center; gap: 8px; }
.ns-eyebrow-icon { display: inline-flex; width: 14px; height: 14px; color: var(--teal-deep); }
.ns-eyebrow-icon svg { width: 14px; height: 14px; }
.ns-eyebrow-r { color: var(--teal-deep); font-family: var(--font); font-weight: 600; font-size: 16px; letter-spacing: 0.04em; text-transform: none; font-feature-settings: "tnum"; }

.ns-headline { margin: 10px 0 12px; text-align: center; font-family: var(--font); font-weight: 700; font-size: 27px; line-height: 1.02; letter-spacing: -0.018em; color: var(--navy); text-wrap: balance; }

.ns-weather { display: flex; align-items: center; gap: 0; margin: 0; color: var(--navy); min-height: 44px; }
.nw-cell { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--navy); font-feature-settings: "tnum"; line-height: 1.1; white-space: nowrap; }
.nw-cell.nw-temp, .nw-cell.nw-rain { flex-direction: row; align-items: center; justify-content: center; gap: 10px; }
.nw-icon-stack { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.nw-emoji { font-size: 26px; line-height: 1; }
.nw-rain-emoji { font-size: 26px; line-height: 1; }
.nw-condition { font-size: 10px; font-weight: 700; color: rgba(28,46,68,0.5); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
.nw-rain-label { font-size: 10px; font-weight: 700; color: rgba(28,46,68,0.5); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
.nw-val { font-weight: 700; font-size: 30px; color: var(--navy); letter-spacing: -0.02em; line-height: 1; }
.nw-rain-pct { font-weight: 700; font-size: 30px; color: var(--navy); letter-spacing: -0.02em; line-height: 1; }
.nw-div { width: 1px; height: 36px; background: linear-gradient(180deg, rgba(28,46,68,0) 0%, rgba(28,46,68,0.22) 50%, rgba(28,46,68,0) 100%); }
.nw-loading { font-size: 14px; color: rgba(28,46,68,0.55); font-weight: 500; }

/* Calendar strip (inside ns-card) */
.calstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin: 4px 0 0; padding: 0; }
.cs-day { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; border-radius: 999px; gap: 2px; width: 38px; margin: 0 auto; }
.cs-letter { font-size: 13px; font-weight: 700; color: var(--navy); letter-spacing: 0.01em; line-height: 1.1; }
.cs-num { font-size: 12.5px; font-weight: 500; color: #5c7280; font-feature-settings: "tnum"; line-height: 1.1; }
.cs-day.is-active { background: var(--teal); box-shadow: 0 6px 16px -4px rgba(47,108,142,0.6); }
.cs-day.is-active .cs-letter, .cs-day.is-active .cs-num { color: #ffffff; }
.cs-day.is-today { background: transparent; border: 1.5px solid rgba(28,46,68,0.22); }
.cs-day.is-today .cs-letter, .cs-day.is-today .cs-num { color: rgba(28,46,68,0.55); }

/* ───────── Combined lower glass card (Next Visit + Last Service) ───────── */
.combo-card { padding: 17px 20px; flex: 0 0 auto; display: flex; flex-direction: column; }
.combo-section { display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; justify-content: center; }
.combo-label { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(28,46,68,0.7); }
.combo-label-icon { display: inline-flex; width: 16px; height: 16px; color: rgba(28,46,68,0.55); }
.combo-label-icon svg { width: 16px; height: 16px; }
.combo-row { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--navy); background: transparent; border: 0; padding: 0; font-family: inherit; }
.combo-card .check-mark { color: var(--teal-deep); display: inline-flex; }
.combo-card .check-mark svg { width: 17px; height: 17px; }
.combo-text { font-weight: 600; color: var(--navy); font-size: 15px; }
.combo-services { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 8px; }
.combo-service { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.combo-service .check-mark svg { width: 16px; height: 16px; }
.combo-service .combo-text { font-size: 13.5px; }
.combo-link { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: var(--teal-deep); text-decoration: none; letter-spacing: 0.01em; margin-top: 2px; }
.combo-link svg { width: 13px; height: 13px; }
.combo-divider { height: 1px; margin: 13px 0; background: linear-gradient(90deg, rgba(28,46,68,0) 0%, rgba(28,46,68,0.14) 18%, rgba(28,46,68,0.14) 82%, rgba(28,46,68,0) 100%); }
.combo-last { width: 100%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; }
.combo-last-date { font-family: var(--font); font-weight: 700; font-size: 22px; color: var(--navy); letter-spacing: -0.01em; white-space: nowrap; }

/* ───────────── Prospect / New-visitor home ───────────── */
.prospect-tag { position: relative; z-index: 2; text-align: center; margin: 0; font-family: var(--font); font-style: normal; font-size: 17px; color: #ffffff; text-shadow: 0 1px 8px rgba(28,46,68,0.55), 0 0 1px rgba(0,0,0,0.4); }
.home-grid-new { max-width: 520px; margin: 0 auto; }
.prospect-hero { position: relative; z-index: 2; margin: 0; padding: 18px 20px 18px; background: var(--frost); border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.7); box-shadow: 0 16px 40px -12px rgba(28,46,68,0.30); }
.ph-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: var(--teal); }
.ph-title { font-family: var(--font); font-weight: 800; font-size: 32px; color: var(--navy); margin-top: 6px; line-height: 1.04; letter-spacing: -0.015em; }
.ph-sub { margin-top: 8px; font-size: 14px; color: #5c7280; line-height: 1.4; text-wrap: pretty; }
.ph-cta {
  margin-top: 18px; width: 100%; background: var(--teal); color: #ffffff; border: 0; padding: 16px; border-radius: 14px;
  font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer; letter-spacing: 0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 10px 22px -8px rgba(47,108,142,0.55); transition: transform 0.15s, box-shadow 0.15s;
}
.ph-cta:hover { transform: translateY(-1px); box-shadow: 0 14px 28px -8px rgba(47,108,142,0.65); }
.ph-cta:active { transform: translateY(0); }
.ph-cta svg { width: 16px; height: 16px; }
.ph-trust { display: flex; gap: 8px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }
.ph-trust .qb { background: rgba(74,143,181,0.10); color: var(--navy); font-weight: 600; padding: 5px 10px; border-radius: 999px; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; box-shadow: none; }
.ph-trust .qb svg { width: 11px; height: 11px; color: var(--teal); }
.hg-logo { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hg-logo .logo-aura { display: block; position: absolute; left: -14px; right: -14px; top: -60px; height: 280px; background: linear-gradient(180deg, rgba(15,28,44,0.50) 0%, rgba(15,28,44,0.40) 35%, rgba(15,28,44,0.18) 65%, rgba(15,28,44,0.0) 100%); pointer-events: none; z-index: 0; }
.hg-logo .ml-logo { position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; }
.hg-logo .ml-logo img, .hg-logo .ml-logo-img { width: 70%; max-width: 300px; height: 120px !important; object-fit: contain !important; display: block; margin: 0 auto; opacity: 1; }

.prospect-steps {
  position: relative; z-index: 2; margin: 14px 0 0; padding: 12px 16px;
  background: var(--frost); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
  border-radius: 18px; border: 0.5px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px -10px rgba(28,46,68,0.20);
  display: flex; flex-direction: column; gap: 8px;
}
.ps-row { display: flex; align-items: center; gap: 12px; color: var(--navy); font-weight: 600; font-size: 14px; text-shadow: none; }
.ps-num { width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #ffffff; font-family: var(--font); font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; text-shadow: none; box-shadow: 0 4px 10px -2px rgba(47,108,142,0.45); }

/* ───────────── Dark header (Schedule, Messages, Services, Account) ───────────── */
.dark-header {
  background: linear-gradient(150deg, #243a55 0%, var(--navy) 55%, #14202f 100%);
  color: #ffffff;
  padding: 28px 24px 22px;
  position: relative;
}
.dark-header.tall { padding-bottom: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dark-header.tall .avatar { color: var(--navy); }
.dh-eyebrow { font-size: 11px; letter-spacing: 0.32em; color: var(--gold); font-weight: 700; }
.dh-title { font-family: var(--font); font-weight: 700; font-size: 34px; margin: 4px 0 0; line-height: 1; letter-spacing: -0.01em; }
.acc-name { font-family: var(--font); font-size: 22px; font-weight: 700; margin-top: 4px; }
.acc-email { font-size: 13px; color: rgba(255,255,255,0.65); }
.acc-badges { display: flex; gap: 6px; margin-top: 6px; }
.dark-header .pill-green { background: rgba(107,163,199,0.30); color: #dff0fa; border: 1px solid rgba(223,240,250,0.25); }

.screen-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1 0 auto; }
.screen-schedule, .screen-services, .screen-account { min-height: calc(100dvh - var(--tabbar-h)); display: flex; flex-direction: column; }

@media (min-width: 880px) {
  .dark-header {
    padding-left: max(40px, calc((100% - var(--content-max)) / 2));
    padding-right: max(40px, calc((100% - var(--content-max)) / 2));
    padding-top: 40px; padding-bottom: 34px;
  }
  .screen-body { max-width: var(--content-max); margin: 0 auto; width: 100%; padding: 32px 40px 56px; }
}

/* ───────────── Schedule ───────────── */
.schedule-grid { display: flex; flex-direction: column; gap: 14px; }
.schedule-list-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 880px) {

/* ── WebView viewport correction ────────────────────────────────
   Inside the iOS shell the page was laid out wider and shorter than the
   screen: the tab bar's last item was cut off on the right, the logo bled
   past both edges, and a white void appeared below the content that turned
   black. All three are the same cause — 100vh is a stale value in a WebView
   and does not account for the dynamic toolbar, and nothing clamped the
   horizontal axis. */

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;                 /* nothing may exceed the screen width */
  background: #fbfcfd;                /* kills the black void below content */
  overscroll-behavior-y: none;        /* no rubber-band revealing the void */
}
#root, .app-shell, .shell {
  max-width: 100%;
  overflow-x: hidden;
}

/* dvh follows the live viewport; vh does not. The fallback keeps older
   WebViews working. */
@supports (height: 100dvh) {
  body { min-height: 100dvh; }
  .app-shell, .shell, #root { min-height: 100dvh; }
}

/* The tab bar sits on the home-indicator, so it needs the safe area or its
   last item is clipped — which is exactly what happened to "Account". */
.tabbar, .tab-bar, nav[class*="tab"] {
  padding-left: max(8px, env(safe-area-inset-left));
  padding-right: max(8px, env(safe-area-inset-right));
  padding-bottom: env(safe-area-inset-bottom);
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
}
.tabbar > *, .tab-bar > *, nav[class*="tab"] > * { min-width: 0; }

/* Anything that would push the page sideways gets clamped. */
img, svg, video, canvas { max-width: 100%; height: auto }

<script>
/* iOS reports the wrong viewport height for a moment after launch, which is
   why the layout corrected itself when you navigated away and back. Nudging
   it on load and on rotation forces the recalculation without the round trip. */
(function () {
  function setVH() {
    document.documentElement.style.setProperty('--ml-vh', window.innerHeight + 'px');
    document.body && (document.body.style.minHeight = window.innerHeight + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(setVH, 120); });
  /* First paint in a WebView often measures before the toolbar settles. */
  [60, 300, 900].forEach(function (t) { setTimeout(setVH, t); });
})();

/*tweaks-panel.jsx*/

// tweaks-panel.jsx
// Reusable Tweaks shell + form-control helpers.
//
// Owns the host protocol (listens for __activate_edit_mode / __deactivate_edit_mode,
// posts __edit_mode_available / __edit_mode_set_keys / __edit_mode_dismissed) so
// individual prototypes don't re-roll it. Ships a consistent set of controls so you
// don't hand-draw <input type="range">, segmented radios, steppers, etc.
//
// Usage (in an HTML file that loads React + Babel):
//
//   const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
//     "primaryColor": "#D97757",
//     "fontSize": 16,
//     "density": "regular",
//     "dark": false
//   }/*EDITMODE-END*/;
//
//   function App() {
//     const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
//     return (
//       <div style={{ fontSize: t.fontSize, color: t.primaryColor }}>
//         Hello
//         <TweaksPanel>
//           <TweakSection label="Typography" />
//           <TweakSlider label="Font size" value={t.fontSize} min={10} max={32} unit="px"
//                        onChange={(v) => setTweak('fontSize', v)} />
//           <TweakRadio  label="Density" value={t.density}
//                        options={['compact', 'regular', 'comfy']}
//                        onChange={(v) => setTweak('density', v)} />
//           <TweakSection label="Theme" />
//           <TweakColor  label="Primary" value={t.primaryColor}
//                        onChange={(v) => setTweak('primaryColor', v)} />
//           <TweakToggle label="Dark mode" value={t.dark}
//                        onChange={(v) => setTweak('dark', v)} />
//         </TweaksPanel>
//       </div>
//     );
//   }
//
// ─────────────────────────────────────────────────────────────────────────────

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}

  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}

  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}

  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}

  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg.dragging .twk-seg-thumb{transition:none}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;
    overflow-wrap:anywhere}

  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}

  .twk-num{display:flex;align-items:center;height:26px;padding:0 0 0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;background:rgba(255,255,255,.6)}
  .twk-num-lbl{font-weight:500;color:rgba(41,38,27,.6);cursor:ew-resize;
    user-select:none;padding-right:8px}
  .twk-num input{flex:1;min-width:0;height:100%;border:0;background:transparent;
    font:inherit;font-variant-numeric:tabular-nums;text-align:right;padding:0 8px 0 0;
    outline:none;color:inherit;-moz-appearance:textfield}
  .twk-num input::-webkit-inner-spin-button,.twk-num input::-webkit-outer-spin-button{
    -webkit-appearance:none;margin:0}
  .twk-num-unit{padding-right:8px;color:rgba(41,38,27,.45)}

  .twk-btn{appearance:none;height:26px;padding:0 12px;border:0;border-radius:7px;
    background:rgba(0,0,0,.78);color:#fff;font:inherit;font-weight:500;cursor:default}
  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel">
/*src/data.jsx*/
// Real date / schedule / weather helpers
const SERVICE_DAY = 4; // Thursday (0=Sun .. 6=Sat)
const SERVICE_WINDOW = { start: "10:30 AM", end: "1:30 PM", short: "10:30 AM" };

// Site-specific notes the crew should see before/during a visit.
// Mix of access info, things flagged on the property, and quiet-life requests.
const CREW_NOTES = [
  { kind: "access",  text: "Gate code 4821 — west-side latch" },
  { kind: "flag",    text: "Front sprinkler head flagged by the rose bed" },
  { kind: "request", text: "Two dogs in back — please knock first" },
];

function todayLocal() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function nextServiceDate(from = todayLocal()) {
  const d = new Date(from);
  d.setHours(0, 0, 0, 0);
  let diff = (SERVICE_DAY - d.getDay() + 7) % 7;
  if (diff === 0) diff = 7; // if today is service day, push to next week
  d.setDate(d.getDate() + diff);
  return d;
}

function lastServiceDate(from = todayLocal()) {
  const d = new Date(from);
  d.setHours(0, 0, 0, 0);
  let diff = (d.getDay() - SERVICE_DAY + 7) % 7;
  if (diff === 0) diff = 7;
  d.setDate(d.getDate() - diff);
  return d;
}

function fmtDay(d) { return d.toLocaleDateString(undefined, { weekday: "long" }); }
function fmtMonthDay(d) { return d.toLocaleDateString(undefined, { month: "long", day: "numeric" }); }
function fmtShort(d) { return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
function fmtMonthYear(d) { return d.toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
function isSameDay(a, b) { return a && b && a.toDateString() === b.toDateString(); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }

function currentWeek(anchor = todayLocal()) {
  // 7 dates from Monday → Sunday containing the anchor
  const d = new Date(anchor);
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const mondayOffset = (day + 6) % 7;
  d.setDate(d.getDate() - mondayOffset);
  return Array.from({ length: 7 }, (_, i) => addDays(d, i));
}

function monthGrid(anchor = todayLocal()) {
  // returns { year, month, cells: [Date|null × 35–42] (Sun-first), serviceDays: Set<number> }
  const year = anchor.getFullYear();
  const month = anchor.getMonth();
  const first = new Date(year, month, 1);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = first.getDay(); // Sun-first
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let i = 1; i <= daysInMonth; i++) cells.push(new Date(year, month, i));
  while (cells.length % 7 !== 0) cells.push(null);

  const serviceDays = new Set();
  for (let i = 1; i <= daysInMonth; i++) {
    if (new Date(year, month, i).getDay() === SERVICE_DAY) serviceDays.add(i);
  }
  return { year, month, cells, serviceDays, daysInMonth };
}

function upcomingServices(count = 3, from = todayLocal()) {
  const out = [];
  let d = nextServiceDate(from);
  for (let i = 0; i < count; i++) {
    out.push(new Date(d));
    d = addDays(d, 7);
  }
  return out;
}

function pastServices(count = 3, from = todayLocal()) {
  const out = [];
  let d = lastServiceDate(from);
  for (let i = 0; i < count; i++) {
    out.push(new Date(d));
    d = addDays(d, -7);
  }
  return out;
}

// member-since: a stable date 6 months back from today, anchored once per browser
function memberSinceDate() {
  try {
    const cached = sessionStorage.getItem("ml_member_since");
    if (cached) return new Date(cached);
  } catch {}
  const d = todayLocal();
  d.setMonth(d.getMonth() - 6);
  d.setDate(1);
  try { sessionStorage.setItem("ml_member_since", d.toISOString()); } catch {}
  return d;
}

function memberMonths() {
  const start = memberSinceDate();
  const now = todayLocal();
  return Math.max(1, (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth()));
}

function servicesCompleted() {
  // weekly cadence ≈ 4 services per month
  return memberMonths() * 4;
}

function relativeWeek(d, anchor = todayLocal()) {
  const days = Math.round((d - anchor) / 86400000);
  if (days < 0) return null;
  if (days < 7) return "this week";
  if (days < 14) return "next week";
  if (days < 21) return "in 2 weeks";
  if (days < 28) return "in 3 weeks";
  return "later this month";
}

// ─────────────────────────────────────────────────────────────
// Weather — Open-Meteo (no key required)
// ─────────────────────────────────────────────────────────────
function weatherEmoji(code) {
  if (code === 0) return "☀️";
  if (code === 1 || code === 2) return "⛅";
  if (code === 3) return "☁️";
  if (code === 45 || code === 48) return "🌫️";
  if ([51,53,55,56,57,80,81,82].includes(code)) return "🌦️";
  if ([61,63,65,66,67].includes(code)) return "🌧️";
  if ([71,73,75,77,85,86].includes(code)) return "❄️";
  if ([95,96,99].includes(code)) return "⛈️";
  return "⛅";
}
function secondaryEmoji(rain) {
  if (rain >= 60) return "🌧️";
  if (rain >= 30) return "🌦️";
  if (rain >= 10) return "🌥️";
  return null;
}
function weatherLabel(code) {
  if (code === 0) return "Clear";
  if (code === 1 || code === 2) return "Partly Cloudy";
  if (code === 3) return "Cloudy";
  if (code === 45 || code === 48) return "Foggy";
  if ([51,53,55,80,81,82].includes(code)) return "Showers";
  if ([61,63,65].includes(code)) return "Rain";
  if ([71,73,75,85,86].includes(code)) return "Snow";
  if ([95,96,99].includes(code)) return "Storms";
  return "Mild";
}
function windLabel(mph) {
  if (mph < 5) return "Calm";
  if (mph < 10) return "Light Wind";
  if (mph < 18) return "Breezy";
  return "Windy";
}

// Cache geocoding results per address
const geoCache = new Map();
async function geocode(address) {
  if (!address) return null;
  if (geoCache.has(address)) return geoCache.get(address);
  // Open-Meteo geocoding wants city alone — strip state/country/zip
  const cleaned = String(address).split(",")[0].replace(/\b\d{5}(-\d{4})?\b/g, "").trim() || address;
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cleaned)}&count=1&language=en&format=json`;
    const r = await fetch(url);
    const j = await r.json();
    const hit = j.results && j.results[0];
    if (!hit) return null;
    const out = { lat: hit.latitude, lon: hit.longitude, tz: hit.timezone || "auto", name: hit.name };
    geoCache.set(address, out);
    return out;
  } catch { return null; }
}

function enrichWeather(raw) {
  if (!raw) return null;
  return {
    ...raw,
    emoji: weatherEmoji(raw.code),
    secondary: secondaryEmoji(raw.rain),
    label: weatherLabel(raw.code),
    windLabel: windLabel(raw.wind),
  };
}

/**
 * Real next and last visit for the signed-in customer.
 *
 * The home card used to compute these locally: take today, jump to the next
 * Thursday. That is arithmetic, not a schedule — a customer on a Tuesday route
 * was told Thursday, confidently and wrongly. This asks the backend.
 *
 * With no customer signed in (the blank-login walkthrough) there is nobody to
 * look up, so it falls back to the weekly guess and says so via `real: false`.
 */
function useSchedule(customerId) {
  const [state, setState] = React.useState({ loading: true, next: null, last: null, real: false });

  React.useEffect(() => {
    let cancelled = false;
    if (!customerId) { setState({ loading: false, next: null, last: null, real: false }); return; }
    setState((p) => ({ ...p, loading: true }));
    (async () => {
      try {
        const [up, past] = await Promise.all([
          window.MLApi.scheduleUpcoming(1),
          window.MLApi.schedulePast(1),
        ]);
        if (cancelled) return;
        const toDate = (v) => {
          if (!v) return null;
          // Dates arrive as plain YYYY-MM-DD. Parsing that directly gives UTC
          // midnight, which reads as the previous day west of Greenwich.
          const [y, m, d] = String(v).slice(0, 10).split("-").map(Number);
          return y ? new Date(y, m - 1, d) : null;
        };
        const nextItem = (up && (up.items || up))[0] || null;
        const lastItem = (past && (past.items || past))[0] || null;
        const next = toDate(nextItem && nextItem.date);
        const last = toDate(lastItem && lastItem.date);
        setState({ loading: false, next, last, real: Boolean(next || last) });
      } catch (e) {
        if (cancelled) return;
        setState({ loading: false, next: null, last: null, real: false });
      }
    })();
    return () => { cancelled = true; };
  }, [customerId]);

  return state;
}

/**
 * Where the phone is.
 *
 * Weather is about where the person is standing, not where we mow. The card
 * used to be pinned to the service area and told a customer in another state
 * that it was "right now in South Jordan". This asks the browser once; if the
 * customer declines, or the device cannot say, everything falls back to the
 * address on file and nothing breaks.
 *
 * Cached for the session so the permission prompt appears once, not on every
 * refresh tick.
 */
function useDeviceCoords() {
  const [coords, setCoords] = React.useState(() => {
    try { return JSON.parse(sessionStorage.getItem("ml_coords") || "null"); }
    catch (e) { return null; }
  });

  React.useEffect(() => {
    if (coords || !navigator.geolocation) return;
    let cancelled = false;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (cancelled) return;
        const c = {
          lat: Number(pos.coords.latitude.toFixed(3)),   // ~100m: enough for weather,
          lng: Number(pos.coords.longitude.toFixed(3)),  // not enough to find a house
        };
        try { sessionStorage.setItem("ml_coords", JSON.stringify(c)); } catch (e) {}
        setCoords(c);
      },
      () => { /* declined or unavailable — the address on file still works */ },
      { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
    );
    return () => { cancelled = true; };
  }, [coords]);

  return coords;
}

function useWeather(address, date) {
  // Weather is the one thing on this card that changes while you are looking at
  // it. Re-ask every ten minutes, and immediately when the app returns to the
  // foreground — a phone parked on this screen was otherwise still showing
  // whatever it fetched at launch, hours earlier.
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => {
    const bump = () => setTick((t) => t + 1);
    const id = setInterval(bump, 600000);
    const onVisible = () => { if (!document.hidden) bump(); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", bump);
    return () => {
      clearInterval(id);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", bump);
    };
  }, []);

  const [state, setState] = React.useState({ loading: true, data: null, error: null });
  const coords = useDeviceCoords();
  const key = `${address || ""}|${date ? date.toDateString() : ""}|${coords ? `${coords.lat},${coords.lng}` : ""}`;
  React.useEffect(() => {
    let cancelled = false;
    setState((prev) => (prev.data ? prev : { loading: true, data: null, error: null }));
    (async () => {
      try {
        // The backend is authoritative but can be slow on a cold start, and a
        // card stuck on "Loading forecast…" is worse than a forecast that
        // arrives from the direct source a beat earlier. Both are real; both
        // are asked at once. The backend answer replaces the other if it lands
        // second, so what you end up looking at is always the authoritative one.
        const addr = address || "South Jordan, UT";

        // The second source geocodes an address string, so it cannot answer at
        // all when the customer has no property on file and the device gave us
        // coordinates — it was returning null while the card waited on it.
        // Both are raced, but nothing waits on the one that cannot answer.
        const authoritative = (window.MLLive
          ? window.MLLive.weather(addr, date, coords)
          : Promise.resolve(null)).catch(() => null);
        const quick = (window.MLMock && !coords
          ? window.MLMock.weather(addr, date)
          : Promise.resolve(null)).catch(() => null);

        let shown = false;
        const show = (raw) => {
          if (cancelled || !raw) return;
          shown = true;
          setState({ loading: false, data: enrichWeather(raw), error: null });
        };

        quick.then((raw) => { if (!shown) show(raw); });

        // A request that never settles leaves the card on "Loading forecast…"
        // forever, which is what a customer actually sees when the network
        // stalls. Give the race a hard ceiling and fall through to the error
        // branch, which at least shows something and lets the next refresh
        // tick retry.
        const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 9000));
        const raw = await Promise.race([authoritative, timeout]);
        if (cancelled) return;
        if (raw) { show(raw); return; }
        const fallback = await Promise.race([quick, timeout]);
        if (cancelled) return;
        if (fallback) { show(fallback); return; }
        throw new Error("no weather data");
      } catch (e) {
        if (cancelled) return;
        setState({
          loading: false,
          error: e.message,
          data: { code: 1, high: 72, low: 58, rain: 10, wind: 5, emoji: "☀️", secondary: "🌥️", label: "Partly Cloudy", windLabel: "Light Wind", city: "South Jordan" },
        });
      }
    })();
    return () => { cancelled = true; };
  }, [key, tick]);
  return state;
}

// ─────────────────────────────────────────────────────────────
// Crew AI replies via window.claude.complete
// ─────────────────────────────────────────────────────────────
async function crewReply({ history, customerName = "Jane", crew = "Crew", nextDate }) {
  const dateStr = nextDate ? fmtShort(nextDate) : "Thursday";
  const persona = `You are ${crew}, the friendly crew lead at Momentum Landscaping, a residential lawn-care company in South Jordan, Utah. You text customers from your phone. Replies must be 1–2 short sentences, warm and professional, no emojis unless natural. Their next scheduled service is ${dateStr} at 10:30 AM. The customer's name is ${customerName}. Reply to their most recent message. Never break character. Never mention you are AI.`;
  const transcript = history.map(m => (m.from === "me" ? `${customerName}: ${m.text}` : `${m.name || crew}: ${m.text}`)).join("\n");
  const prompt = `${persona}\n\nConversation so far:\n${transcript}\n\nReply as ${crew} (just the message text, no name prefix):`;
  try {
    const out = await window.claude.complete(prompt);
    return (out || "").trim().replace(/^["']|["']$/g, "");
  } catch (e) {
    return "Got it — thanks for letting us know! We'll see you Thursday.";
  }
}

window.MLData = {
  SERVICE_DAY, SERVICE_WINDOW, CREW_NOTES,
  todayLocal, nextServiceDate, lastServiceDate,

  upcomingServices, pastServices,
  memberSinceDate, memberMonths, servicesCompleted,
  relativeWeek,
  useWeather, useSchedule, weatherEmoji, weatherLabel, windLabel,
  crewReply,
};

<script type="text/babel">
/*src/api.jsx*/
// src/api.jsx — front-end client that talks to the Momentum backend.
//
// MODE === "live"  → calls the real API at MLConfig.apiBase
//                    (defaults to /api/portal — the local mock backend)
// MODE === "mock"  → uses in-page MLData / sessionStorage so the prototype
//                    stays demo-able with no server running
//
// Live methods auto-fall-back to the Mock implementation if a request
// fails (network down, CORS, server stopped), so the prototype never
// breaks when the backend isn't reachable.
//
// Override at runtime:
//   window.MLConfig = Object.assign({ mode: "live", apiBase: "/api/portal" }, window.MLConfig || {});

const DEFAULT_BASE = "/api/portal";
window.MLConfig = Object.assign({ mode: "mock", apiBase: DEFAULT_BASE }, window.MLConfig || {});

const MODE = () => (window.MLConfig?.mode || "mock");
const BASE = () => (window.MLConfig?.apiBase || DEFAULT_BASE);

async function authHeader() {
  const sb = window.MLConfig?.supabaseClient;
  if (!sb) return { Authorization: "Bearer demo" }; // mock backend accepts any token
  const { data } = await sb.auth.getSession();
  const t = data?.session?.access_token;
  return t ? { Authorization: `Bearer ${t}` } : { Authorization: "Bearer demo" };
}

async function call(path, { method = "GET", body, signal, timeoutMs = 6000 } = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const headers = { "Content-Type": "application/json", ...(await authHeader()) };
    // Every portal route is keyed on customer_id and none of them read the
    // bearer token, so the id has to ride along on the request itself. Without
    // this the app was calling the backend and getting nothing back, then
    // quietly showing samples instead.
    let url = `${BASE()}${path}`;
    try {
      const cid = sessionStorage.getItem("ml_customer_id");
      if (cid && !/[?&]customer_id=/.test(url)) {
        url += (url.includes("?") ? "&" : "?") + "customer_id=" + encodeURIComponent(cid);
      }
    } catch (e) {}
    const r = await fetch(url, {
      method, headers,
      signal: signal || ctrl.signal,
      body: body
        ? JSON.stringify(
            (() => {
              try {
                const cid = sessionStorage.getItem("ml_customer_id");
                return cid && body && typeof body === "object" && !Array.isArray(body) && !body.customer_id
                  ? { ...body, customer_id: cid }
                  : body;
              } catch (e) { return body; }
            })()
          )
        : undefined,
    });
    const text = await r.text();
    const json = text ? JSON.parse(text) : null;
    if (!r.ok) throw Object.assign(new Error(json?.message || r.statusText), { status: r.status, body: json });
    return json;
  } finally { clearTimeout(t); }
}

// ─── Mock fallbacks (use existing in-memory MLData + sessionStorage) ─────
const Mock = {
  async status() { return { ok: true, mode: "mock", live: {} }; },
  async me() {
    return {
      full_name: window.MLConfig?.customerName || "there",
      email: "demo@momentumlandscapingut.com",
      plan: "Weekly Lawn Care",
    };
  },
  async stats() {
    return {
      services_completed: MLData.servicesCompleted(),
      on_time_pct: 100,
      member_since: MLData.memberSinceDate().toISOString(),
    };
  },
  async scheduleUpcoming(limit = 3) {
    return MLData.upcomingServices(limit).map((d, i) => ({
      id: `mock-${i}`, scheduled_for: d.toISOString(),
      status: i === 0 ? "confirmed" : "scheduled",
      crew_lead: "Momentum Crew", services: [{ id: "weekly", qty: 1 }],
    }));
  },
  async schedulePast(limit = 3) {
    return MLData.pastServices(limit).map((d, i) => ({
      id: `mock-p-${i}`, scheduled_for: d.toISOString(),
      status: "completed", rating: i === 0 ? 5 : null, crew_lead: "Momentum Crew",
    }));
  },
  async scheduleMonth(year, month) {
    const days = MLData.monthGrid(new Date(year, month - 1, 1));
    const appts = [...days.serviceDays].map(n => ({
      id: `mock-m-${n}`,
      scheduled_for: new Date(year, month - 1, n, 10, 30).toISOString(),
      status: "scheduled",
    }));
    return { year, month, appointments: appts };
  },
  async weather(address, date) {
    // Direct Open-Meteo (no backend) — returns the raw shape; useWeather enriches.
    try {
      const cleaned = String(address).split(",")[0].replace(/\b\d{5}(-\d{4})?\b/g, "").trim() || address;
      const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cleaned)}&count=1&language=en&format=json`).then(r => r.json());
      const hit = g.results?.[0];
      if (!hit) return null;
      const iso = date.toISOString().slice(0, 10);
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${hit.latitude}&longitude=${hit.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=${hit.timezone || "auto"}&start_date=${iso}&end_date=${iso}`;
      const j = await fetch(url).then(r => r.json());
      const dl = j.daily;
      return {
        code: dl.weather_code[0],
        high: Math.round(dl.temperature_2m_max[0]),
        low:  Math.round(dl.temperature_2m_min[0]),
        rain: Math.round(dl.precipitation_probability_max[0] || 0),
        wind: Math.round(dl.wind_speed_10m_max[0]),
        city: hit.name, date: iso,
      };
    } catch { return null; }
  },
  async messagesList() { return JSON.parse(sessionStorage.getItem("ml_msgs") || "[]"); },
  async messagesSend(body) {
    const list = await Mock.messagesList();
    list.push({ id: `m-${Date.now()}`, sender: "customer", sender_name: "Jane", body, created_at: new Date().toISOString() });
    sessionStorage.setItem("ml_msgs", JSON.stringify(list));
    return { ok: true };
  },
  async servicesCatalog() {
    return [
      { id: "weekly", name: "Weekly Lawn Maintenance", price_cents: 4500, emoji: "🌱" },
      { id: "aerate", name: "Aeration",                price_cents: 9500, emoji: "🌾" },
      { id: "mulch",  name: "Mulch Refresh",           price_cents: 18000, emoji: "🪵" },
      { id: "fert",   name: "Fertilization",           price_cents: 24000, emoji: "💧" },
      { id: "trim",   name: "Hedge & Shrub Trim",      price_cents: 7500, emoji: "✂️" },
      { id: "leaf",   name: "Leaf Cleanup",            price_cents: 12000, emoji: "🍂" },
    ];
  },
  async servicesRequest(items, note) { void 0; return { ok: true }; },
  async quotesCreate(payload)  { void 0; return { ok: true, eta_minutes: 60 }; },
  async paymentMethod()         { return { brand: "visa", last4: "4421", exp: "9/27" }; },
  async invoices() {
    return [{ id: "mock-inv", amount_cents: 4500, status: "open", due_at: new Date(Date.now() + 7 * 864e5).toISOString() }];
  },
  async payInvoice()  { return { ok: true, status: "paid", mock: true }; },
  async setupIntent() { return { client_secret: `seti_mock_${Date.now()}`, mock: true }; },
  async getAutopay()  { return { enabled: true }; },
  async setAutopay()  { return { ok: true }; },
  async calendarStatus() {
    const raw = sessionStorage.getItem("ml_cal_mock");
    const saved = raw ? JSON.parse(raw) : {};
    return {
      google: saved.google ? { connected: true, email: saved.google } : { connected: false },
      microsoft: saved.microsoft ? { connected: true, email: saved.microsoft } : { connected: false },
      apple: { feed_url: "webcal://app.momentumlandscaping.com/calendar/feed/demo-token.ics" },
      live: { google: false, microsoft: false },
    };
  },
  async calendarConnectUrl() { return { mock: true }; },
  async calendarMockConnect(provider, email) {
    const raw = sessionStorage.getItem("ml_cal_mock");
    const saved = raw ? JSON.parse(raw) : {};
    saved[provider] = email;
    sessionStorage.setItem("ml_cal_mock", JSON.stringify(saved));
    return { ok: true };
  },
  async calendarDisconnect(provider) {
    const raw = sessionStorage.getItem("ml_cal_mock");
    const saved = raw ? JSON.parse(raw) : {};
    delete saved[provider];
    sessionStorage.setItem("ml_cal_mock", JSON.stringify(saved));
    return { ok: true };
  },
  async calendarSync() { return { ok: true, pushed: { google: 4, microsoft: 4 } }; },
};

// ─── Live API surface (calls backend routes) ─────────────────────────────
const Live = {
  status:           () => call("/status"),
  me:               () => call("/me"),
  stats:            () => call("/me/stats"),
  scheduleUpcoming: (limit = 3) => call(`/schedule/upcoming?limit=${limit}`),
  schedulePast:     (limit = 3) => call(`/schedule/past?limit=${limit}`),
  scheduleMonth:    (y, m)      => call(`/schedule/month?year=${y}&month=${m}`),
  weather:          (address, date, coords) =>
                      call(`/weather?address=${encodeURIComponent(address)}&date=${date.toISOString().slice(0, 10)}` +
                           (coords ? `&lat=${coords.lat}&lng=${coords.lng}` : "")),
  messagesList:     (since)     => call(`/messages${since ? `?since=${since.toISOString()}` : ""}`),
  messagesSend:     (body)      => call("/messages", { method: "POST", body: { body } }),
  servicesCatalog:  ()          => call("/services/catalog"),
  servicesRequest:  (items, note) => call("/services/request", { method: "POST", body: { items, note } }),
  quotesCreate:     (payload)   => call("/quotes", { method: "POST", body: payload }),
  paymentMethod:    ()          => call("/payments/method"),
  invoices:         ()          => call("/payments/invoices"),
  payInvoice:       (id)        => call(`/payments/invoices/${id}/pay`, { method: "POST" }),
  setupIntent:      ()          => call("/payments/setup-intent", { method: "POST" }),
  getAutopay:       ()          => call("/payments/autopay"),
  setAutopay:       (enabled, payment_method_id) =>
                      call("/payments/autopay", { method: "POST", body: { enabled, payment_method_id } }),
  calendarStatus:      async ()    => {
    const r = await call("/calendar/status");
    // The route answers { providers: [...] }; the screen reads status.google
    // and status.apple. Key it here rather than at every call site — indexing
    // the array by name gave undefined, and reading .connected off that threw,
    // which took the whole app down to a white screen.
    if (r && Array.isArray(r.providers)) {
      const keyed = {};
      for (const p of r.providers) if (p && p.id) keyed[p.id] = p;
      return { ...r, ...keyed };
    }
    return r;
  },
  calendarConnectUrl:  (provider)  => call(`/calendar/${provider}/connect`),
  calendarMockConnect: (provider, email) => call(`/calendar/${provider}/mock-connect`, { method: "POST", body: { email } }),
  calendarDisconnect:  (provider)  => call(`/calendar/${provider}/disconnect`, { method: "POST" }),
  calendarSync:        ()          => call("/calendar/sync", { method: "POST" }),
};

// ─── Dispatch with graceful fallback ─────────────────────────────────────
const MLApi = new Proxy({}, {
  get(_, key) {
    return async (...args) => {
      // Weather is real in every mode. It is keyed on an address, not on a
      // customer, so there is never a reason to serve a made-up forecast — and
      // a walkthrough session switching the app to sample data was silently
      // taking the forecast down with it.
      const wantLive = MODE() === "live" || key === "weather";
      const liveFn = Live[key];
      const mockFn = Mock[key];
      if (wantLive && liveFn) {
        try { return await liveFn(...args); }
        catch (e) {
          console.warn(`[MLApi] live ${String(key)} failed → mock fallback:`, e.message);
          if (mockFn) return await mockFn(...args);
          throw e;
        }
      }
      if (mockFn) return await mockFn(...args);
      if (liveFn) return await liveFn(...args);
      throw new Error(`MLApi: no method '${String(key)}'`);
    };
  },
});

window.MLApi = MLApi;
window.MLLive = Live;
window.MLMock = Mock;

// Real photographic landscape — with parallax scroll
function LandscapeBG({ intensity = 1, parallaxRef = null, parallaxFactor = 0.45 }) {
  const photoRef = React.useRef(null);

  React.useEffect(() => {
    const scroller = parallaxRef && parallaxRef.current;
    const photo = photoRef.current;
    if (!photo) return;
    const apply = (y) => {
      photo.style.transform = `translate(-50%, calc(-50% + ${y * parallaxFactor}px))`;
    };
    apply(0);
    if (!scroller) return;
    let raf = 0;
    const onScroll = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => apply(scroller.scrollTop));
    };
    scroller.addEventListener("scroll", onScroll, { passive: true });
    return () => {
      scroller.removeEventListener("scroll", onScroll);
      cancelAnimationFrame(raf);
    };
  }, [parallaxRef, parallaxFactor]);

  return (
    <div className="landscape-bg" aria-hidden="true">
      <img ref={photoRef} src={window.ML_BG_SRC || "assets/landscape-bg.png"} alt="" className="bg-photo" />
      <div className="bg-photo-vignette" />
    </div>
  );
}

window.LandscapeBG = LandscapeBG;

<script type="text/babel">
/*src/screen-login.jsx*/
function LoginScreen({ onLogin, onGetQuote, onSneakPeek, mode }) {
  // Email and password. There is no texted-code option and there never was —
  // the phone tab offered customers a way in that does not exist, and pointing
  // a failed password at it sent them somewhere that could not help.
  const [email, setEmail] = React.useState("");
  const [password, setPassword] = React.useState("");
  const [busy, setBusy] = React.useState(false);
  const [err, setErr] = React.useState("");

  const base = () => (window.MLConfig && window.MLConfig.apiBase) || "";

  const signIn = async (e) => {
    e.preventDefault();

    // Both fields blank opens the app to look around. This goes straight to the
    // demo account rather than through /auth — posting blank credentials asked
    // the server to authenticate nobody, and it correctly refused, which is why
    // tapping Sign In did nothing but show an error.
    if (!email.trim() && !password) {
      setErr("");
      onSneakPeek();
      return;
    }

    if (!email.trim() || !password) { setErr("Enter your email and password."); return; }

    setErr(""); setBusy(true);
    try {
      const r = await fetch(base() + "/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      const txt = await r.text();
      const json = txt ? JSON.parse(txt) : null;
      if (!r.ok) throw new Error((json && json.error) || "That didn't work. Try again.");
      onLogin({
        id: json.customer_id,
        name: json.name || json.first_name || null,
        email: json.email || email.trim(),
        greeting: json.greeting,
        known: json.known,
        needs: json.needs || [],
      });
    } catch (ex) {
      setErr(ex.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="screen screen-login">
      <LandscapeBG intensity={1} />
      <div className="login-body">
        <div className="login-logo-wrap">
          <MomentumLogo size={1.05} />
        </div>
        <div className="login-tag">Your lawn, on autopilot.</div>

        <form className="login-form" onSubmit={signIn}>
          <label className="lf-label" htmlFor="lf-email">Email</label>
          <input
            id="lf-email" className="lf-input" type="email" autoComplete="email"
            placeholder="you@email.com"
            value={email} onChange={(e) => { setEmail(e.target.value); if (err) setErr(""); }}
          />

          <label className="lf-label" htmlFor="lf-pass">Password</label>
          <input
            id="lf-pass" className="lf-input" type="password" autoComplete="current-password"
            placeholder="••••••••"
            value={password} onChange={(e) => { setPassword(e.target.value); if (err) setErr(""); }}
          />

          {err && <div className="lf-err">{err}</div>}

          <button className="lf-submit" type="submit" disabled={busy}>
            {busy ? "Signing in…" : "Sign In"}
          </button>

          <div className="lf-hint">Leave both blank and tap Sign In to look around.</div>
        </form>

        <button type="button" className="login-quote-link" onClick={onSneakPeek}>
          Sneak peek — <span className="lql-cta">look inside the app →</span>
        </button>
      </div>
    </div>
  );
}

window.LoginScreen = LoginScreen;

</script>

  const [pickedDate, setPickedDate] = React.useState(null);

              <div className="ns-weather" role="group" aria-label="Forecast">

                  <span className="nw-loading">Loading forecast…</span> :

                        <span className="nw-condition">{w.label}</span>
                      </span>

function CalendarStrip({ dates, activeDate, today, serviceDate, onPick }) {
  const letters = ["M", "T", "W", "T", "F", "S", "S"];
  return (
    <div className="calstrip">
      {dates.map((d, i) => {
        const isActive = MLData.isSameDay(d, activeDate);

        // visit look like the day you were reading, which is what made Friday
        // appear selected on a Wednesday.

        const label = `${MLData.fmtDay(d)}, ${MLData.fmtMonthDay(d)}${isService ? " — service day" : ""}`;

          <button

            className={`cs-day ${isActive ? "is-active" : ""} ${isToday && !isActive ? "is-today" : ""} ${isService ? "has-service" : ""}`}

<script type="text/babel">
/*src/screen-messages.jsx*/
function MessagesScreen({ tweaks, customerName }) {
  const firstName = (customerName || "there").split(" ")[0];
  // Starts empty and fills in from the real thread. It used to seed a made-up
  // exchange about a gate code that never happened, which read as history.
  const [msgs, setMsgs] = React.useState([]);
  const [loaded, setLoaded] = React.useState(false);

  const toBubble = React.useCallback((m) => ({
    from: m.direction === "inbound" || m.sender === "customer" ? "me" : "C",
    name: m.sender === "customer" ? undefined : "Crew",
    text: m.body,
    time: new Date(m.created_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
  }), []);

  React.useEffect(() => {
    let cancelled = false;
    window.MLApi.messagesList()
      .then((r) => {
        if (cancelled) return;
        const list = (r && r.messages) || [];
        setMsgs(Array.isArray(list) ? list.map(toBubble) : []);
      })
      .catch(() => { if (!cancelled) setMsgs([]); })
      .finally(() => { if (!cancelled) setLoaded(true); });
    return () => { cancelled = true; };
  }, [toBubble]);
  const [draft, setDraft] = React.useState("");
  const [typing, setTyping] = React.useState(false);
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [msgs, typing]);

  const send = async () => {
    if (!draft.trim() || typing) return;
    const text = draft.trim();
    const time = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const userMsg = { from: "me", text, time };
    const history = [...msgs, userMsg];
    setMsgs(history);
    setDraft("");
    setTyping(true);
    try {
      const sent = await window.MLApi.messagesSend(text);
      if (sent && Array.isArray(sent.messages)) {
        setTyping(false);
        setMsgs(sent.messages.map(toBubble));
        return;
      }
      const reply = await MLData.crewReply({
        history,
        customerName: (customerName || "Jane").split(" ")[0],
        crew: "Crew",
        nextDate: MLData.nextServiceDate(),
      });
      setMsgs((m) => [...m, {
        from: "C",
        name: "Crew",
        text: reply,
        time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      }]);
    } catch {
      setMsgs((m) => [...m, {
        from: "C",
        name: "Crew",
        text: "Got it — appreciate the heads up. We'll see you Thursday!",
        time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
      }]);
    } finally {
      setTyping(false);
    }
  };

  const crew = { letter: "C", name: "Crew", color: "#4a8fb5" };
  const quickReplies = ["Thanks!", "What time will you arrive?", "Please knock — dogs in back"];

  return (
    <div className="screen screen-messages">
      <div className="dark-header">
        <div className="dh-eyebrow">MESSAGE</div>
        <h1 className="dh-title">Your Crew</h1>
      </div>

      <div className="crew-row">
        <div className="crew-chip">
          <div className="crew-avatar" style={{ background: crew.color }}>
            {crew.letter}
            <span className="online-dot" />
          </div>
